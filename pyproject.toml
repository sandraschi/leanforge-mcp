[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leanforge-mcp"
version = "0.1.0"
description = "MCP server for AI-driven formal proof search in Lean 4"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sandraschi" }]
keywords = ["mcp", "lean4", "theorem-proving", "formal-verification", "mathematics"]

dependencies = [
    "fastmcp>=3.4.2",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sse-starlette>=2.1.0",
]

[project.scripts]
leanforge-mcp = "leanforge_mcp.server:main"
leanforge-web = "webapp.backend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leanforge_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "PTH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
